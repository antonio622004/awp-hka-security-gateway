# Opt-in addition to compose.yml. No services are started by this file alone.
services:
  gateway:
    environment:
      GW_APP_UPSTREAM: ${GW_APP_UPSTREAM:-}
      GW_REGISTRY_URL: http://portal-registry:8000
      GW_REGISTRY_SERVICE_TOKEN_FILE: /run/secrets/registry_service_token
    secrets:
      - registry_service_token
    networks:
      sessions: {}
      identity: {}
      registry: {}

networks:
  registry:
    external: true
    name: ${HKA_REGISTRY_NETWORK:?Set a dedicated internal Portal-Gateway network}

secrets:
  registry_service_token:
    file: ${HKA_REGISTRY_SERVICE_TOKEN_FILE:?Set an external registry service token file}
