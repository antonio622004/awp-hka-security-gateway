name: hka-security-gateway-phase1

services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      GW_PUBLIC_URL: ${GW_PUBLIC_URL:-http://localhost:18080}
      GW_OIDC_ISSUER: ${GW_OIDC_ISSUER:-http://localhost:8180/realms/hka}
      GW_OIDC_DISCOVERY_URL: ${GW_OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/hka/.well-known/openid-configuration}
      GW_OIDC_CLIENT_ID: ${GW_OIDC_CLIENT_ID:-portal}
      GW_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_secret
      GW_SIGNING_KEY_FILE: /run/secrets/signing_key
      GW_REDIS_URL: redis://gateway-redis:6379/0
      GW_COOKIE_SECURE: ${GW_COOKIE_SECURE:-false} # Loopback HTTP only; HTTPS requires true.
      GW_DEMO_ENABLED: "true"
      GW_SESSION_SECONDS: ${GW_SESSION_SECONDS:-300}
      GW_SESSION_IDLE_SECONDS: ${GW_SESSION_IDLE_SECONDS:-300}
      GW_SESSION_TOUCH_SECONDS: ${GW_SESSION_TOUCH_SECONDS:-60}
      GW_ASSERTION_SECONDS: ${GW_ASSERTION_SECONDS:-60}
    secrets: [oidc_secret, signing_key]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [sessions, identity]
    depends_on:
      gateway-redis:
        condition: service_healthy

  gateway-redis:
    image: redis:8-alpine
    user: redis
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [sessions]
    # No published port; no connection to the existing portal's networks/Redis.
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  sessions:
    internal: true
  identity:
    external: true
    name: ${GW_KEYCLOAK_NETWORK:?Set the existing Keycloak Docker network}

secrets:
  oidc_secret:
    file: ${GW_OIDC_CLIENT_SECRET_FILE:?Set an existing external client secret file}
  signing_key:
    file: ${GW_LOCAL_DIR:?Use python3 tools/dev.py up}/signing-key.pem
