# Keycloak (IdP, Realm "hka", Login-Theme im Look des Portals) für das Security-Gateway.
# Wird von gateway/compose.yml eingebunden (wie redis/). Nur das Gateway spricht intern mit Keycloak (Netz "identity").
# Der Browser erreicht Keycloak über 127.0.0.1:8180 (lokal direkt, auf der VM über nginx unter /auth).
# KC_HOSTNAME legt den issuer fest, den der Browser sieht; KC_HOSTNAME_BACKCHANNEL_DYNAMIC liefert dem Gateway
# Token- und JWKS-URLs unter keycloak:8080.
name: hka-keycloak

services:
  keycloak:
    image: hka/keycloak:${KEYCLOAK_IMAGE_TAG:-local}
    platform: linux/amd64
    build: .                                # keycloak/Dockerfile: Theme + Realm, Kit als versionierte Kopie
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Admin-Passwort für Keycloak fehlt (.env)}
      KC_HTTP_PORT: "8080"
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded          # VM: nginx setzt X-Forwarded-*; lokal ohne Wirkung (nur Loopback)
    ports:
      - "127.0.0.1:8180:8080"
    networks: [identity, keycloak-port]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  identity:
    internal: true              # nur Gateway <-> Keycloak
  keycloak-port: {}             # nur für den Hostport 8180 (an internen Netzen veröffentlicht Docker keine Ports)
