# Test-VM iwi-hean-05: Security-Gateway + Gateway-Redis + Portal in EINEM Compose-Projekt, hinter nginx (HTTPS).
# Ersetzt backend + redis aus portal/extras/compose/vm/compose.yml; Keycloak bleibt dort und wird über ein externes Netz genutzt.
#
# Netze (Segmentierung, kein Flat-Network):
#   sessions  intern  gateway <-> gateway-redis
#   portal    intern  gateway <-> portal       (Portal hat weder Redis noch Keycloak noch Internet)
#   vm        extern  gateway, portal <-> keycloak und app-<slug> (bestehendes Netz hka-portal-vm_default, in dem Keycloak
#                     und die App-Container der Pipeline schon laufen; Portal dort nur für den Prober /healthz).
#                     Später besser: Apps in ein eigenes Netz verschieben und das Portal von Keycloak trennen.
#
# Die VM erreicht keine Registry. Images auf dem Mac bauen und übertragen:
#   Mac:  docker compose -f compose.vm.yml build gateway           # hka/security-gateway:0.1.0
#         docker build -t hka/portal:0.2.1-gateway ../portal      # Portal-Image wie bisher (Dockerfile)
#         docker pull --platform linux/amd64 redis:8-alpine
#         docker save hka/security-gateway:0.1.0 hka/portal:0.2.1-gateway redis:8-alpine | gzip > ~/Downloads/gateway-vm.tar.gz
#         scp ~/Downloads/gateway-vm.tar.gz compose.vm.yml sadmin@iwi-hean-05.hs-karlsruhe.de:~
#   VM:   gunzip -c ~/gateway-vm.tar.gz | sudo docker load
#         sudo docker compose -f ~/compose.vm.yml up -d --no-build
#
# Vorbereitung auf der VM (einmalig, nicht in Git):
#   /srv/portal/gateway/secrets/signing-key.pem          RSA 3072 (openssl genpkey), chmod 444
#   /srv/portal/gateway/secrets/oidc-client-secret       Secret des Keycloak-Clients "portal", chmod 444
#   /srv/portal/gateway/secrets/registry-service-token   secrets.token_urlsafe(32), chmod 444, nur Gateway + Portal
#   /srv/portal/gateway/roles.yml                        Kopie von portal/dev/roles.yml (IdP-Claims -> Rollen)
#   Ordner /srv/portal/{manifests,status,registry} wie bisher (portal-deploy), Verzeichnis secrets/ chmod 700
# nginx: location / zeigt auf 127.0.0.1:18080 (portal/extras/compose/vm/nginx-portal.conf).
name: hka-gateway-vm

x-vm-hosts: &public https://iwi-hean-05.hs-karlsruhe.de

services:
  gateway:
    image: hka/security-gateway:0.1.0
    platform: linux/amd64
    build:
      context: .
      target: final
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      GW_PUBLIC_URL: *public
      GW_COOKIE_SECURE: "true"
      GW_OIDC_ISSUER: https://iwi-hean-05.hs-karlsruhe.de/auth/realms/hka
      GW_OIDC_DISCOVERY_URL: http://keycloak:8080/auth/realms/hka/.well-known/openid-configuration
      GW_OIDC_CLIENT_ID: portal
      GW_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_secret
      GW_SIGNING_KEY_FILE: /run/secrets/signing_key
      GW_REDIS_URL: redis://gateway-redis:6379/0
      GW_DEMO_ENABLED: "false"
      GW_PORTAL_UPSTREAM: http://portal:8000
      GW_REGISTRY_URL: http://portal:8000
      GW_REGISTRY_SERVICE_TOKEN_FILE: /run/secrets/registry_service_token
      GW_INTERNAL_HOSTS: gateway            # Host-Header des JWKS-Abrufs durch das Portal
      GW_APP_UPSTREAM: http://app-{slug}:8080
      GW_ROLES_FILE: /run/config/roles.yml
      GW_ROLE_VOCABULARY: student,employee,professor,platform-admin,pilot-tester
    volumes:
      - /srv/portal/gateway/roles.yml:/run/config/roles.yml:ro
    secrets: [oidc_secret, signing_key, registry_service_token]
    networks: [sessions, portal, vm]
    depends_on:
      gateway-redis:
        condition: service_healthy
      portal:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  gateway-redis:
    image: redis:8-alpine
    platform: linux/amd64
    user: redis
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [sessions]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  portal:
    image: hka/portal:0.2.1-gateway
    platform: linux/amd64
    environment:
      PORTAL_CONFIG: /opt/app/dev/gateway.vm.yml
      PORTAL_REGISTRY_SERVICE_TOKEN_FILE: /run/secrets/registry_service_token
    volumes:
      # Wie bisher: Manifeste (portal-deploy), Status (Prober), Besitzer/Stilllegungen/Grants (Verwaltungsseite).
      - /srv/portal/manifests:/var/lib/portal/manifests:rw
      - /srv/portal/status:/var/lib/portal/status:rw
      - /srv/portal/registry:/var/lib/portal/registry:rw
    secrets: [registry_service_token]
    networks: [portal, vm]   # kein Hostport: erreichbar nur über das Gateway
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  sessions:
    internal: true
  portal:
    internal: true
  vm:
    external: true
    name: ${HKA_VM_NETWORK:-hka-portal-vm_default}

secrets:
  oidc_secret:
    file: /srv/portal/gateway/secrets/oidc-client-secret
  signing_key:
    file: /srv/portal/gateway/secrets/signing-key.pem
  registry_service_token:
    file: /srv/portal/gateway/secrets/registry-service-token
