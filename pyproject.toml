[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hka-security-gateway"
version = "0.1.0"
description = "Standalone HKA OIDC/session/assertion gateway, phase 1"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "redis==8.1.0",
  "loguru==0.7.3",
  "PyYAML>=6,<7",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = ["pytest==9.1.1", "fakeredis==2.40.0", "httpx2==2.16.0", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

